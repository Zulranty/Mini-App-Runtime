<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script type="application/miniapp+json">
{
  "id": "com.example.peer-transfer",
  "name": "Peer Transfer",
  "version": "1.0.1",
  "sdkVersion": 2,
  "description": "Local peer discovery and transfer demonstration.",
  "permissions": ["local.peers", "files.pick", "files.directory"]
}
</script>
<title>Peer Transfer</title>
<style>
body{font:16px system-ui;margin:24px;max-width:720px;background:#10131a;color:#f5f7ff}button,input{font:inherit;padding:9px;margin:4px}button{background:#5373ff;color:white;border:0;border-radius:8px}.peer{padding:12px;margin:8px 0;background:#1c2230;border-radius:8px}.muted{color:#aab3c8}pre{white-space:pre-wrap;background:#0b0d12;padding:12px;border-radius:8px}
</style>
<h1>Peer Transfer</h1><p id="state" class="muted">Checking local-peer support…</p>
<button id="grant">Allow device discovery</button><button id="refresh">Refresh devices</button>
<div id="peers"></div><hr><input id="message" placeholder="Message"><button id="send">Send</button><pre id="log"></pre>
<script>
const state=document.querySelector('#state'), peers=document.querySelector('#peers'), log=document.querySelector('#log'); let selected=null, channel=null;
const say=value=>log.textContent+=`${new Date().toLocaleTimeString()} ${value}\n`;
async function refresh(){ try { await mini.peers.startDiscovery(); const list=await mini.peers.list(); peers.replaceChildren(...list.map(p=>{const row=document.createElement('div');row.className='peer';row.textContent=`${p.name} (${p.platform}) — ${p.status}`;const b=document.createElement('button');b.textContent='Connect';b.onclick=async()=>{await mini.peers.connect(p.id);selected=p.id;channel=await mini.peers.openChannel({peerId:p.id,name:'default'});say(`Connecting to ${p.name}`)};row.append(' ',b);return row})); }catch(e){say(`${e.code||'error'}: ${e.message}`)} }
document.querySelector('#grant').onclick=async()=>{try{await mini.peers.startDiscovery();state.textContent='Searching the local network…';await refresh()}catch(e){state.textContent=`${e.code||'error'}: ${e.message}`}};
document.querySelector('#refresh').onclick=refresh;
document.querySelector('#send').onclick=async()=>{if(!selected||!channel)return say('Connect to a device first.');try{await mini.peers.sendMessage({peerId:selected,channelId:channel.id||channel,data:{type:'chat',text:document.querySelector('#message').value}})}catch(e){say(`${e.code||'error'}: ${e.message}`)}};
mini.events.on('peers.changed',refresh);mini.events.on('peers.message',event=>say(`Peer: ${JSON.stringify(event.data)}`));
(async()=>{const supported=await mini.runtime.supports('peers'); state.textContent=supported?'Local peers are available.':'This Runtime build does not yet provide local peers.'; if(supported&&await mini.permissions.query('local.peers')==='granted'){await mini.peers.startDiscovery();refresh()}})();
</script>
</html>
