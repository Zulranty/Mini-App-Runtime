<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Apps</title><style>:root{color-scheme:dark;font-family:system-ui;background:#12141c;color:#f6f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:24px 16px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:16px}h1{font-size:28px;margin:0}p,small{color:#aeb6c8}button{border:0;border-radius:12px;background:#365bff;color:#fff;padding:11px 15px;font-size:16px;cursor:pointer}.icon{width:44px;height:44px;padding:0;font-size:24px}.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.app{position:relative;min-height:116px;background:#1d2130;border:1px solid #2b3144;border-radius:16px;padding:16px 52px 16px 16px;cursor:pointer}.app h2{margin:0 0 7px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dots{position:absolute;top:8px;right:8px;width:40px;height:40px;padding:0;background:transparent}.menu{position:fixed;z-index:10;min-width:210px;padding:6px;background:#242936;border:1px solid #3a4254;border-radius:10px;box-shadow:0 12px 28px #0008}.menu button{display:block;width:100%;background:transparent;text-align:left;border-radius:6px}.menu button:hover{background:#365bff}.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:#0009}.panel{width:min(440px,100%);background:#242936;border:1px solid #3a4254;border-radius:16px;padding:20px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;z-index:30;left:50%;bottom:18px;transform:translateX(-50%);padding:10px 14px;background:#2d3445;border-radius:10px;opacity:0;transition:.15s}.toast.on{opacity:1}@media(max-width:480px){main{padding:16px 12px}.apps{grid-template-columns:1fr}}</style><main><header><div><h1>Mini Apps</h1><p>Local HTML apps</p></div><button id="more" class="icon" aria-label="Menu">⋮</button></header><section id="apps" class="apps"></section><p id="empty" hidden>No mini-apps found.</p></main><div id="toast" class="toast" role="status"></div><script>(()=>{let menu,busy=0;const $=s=>document.querySelector(s),apps=$('#apps'),toast=$('#toast'),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),say=s=>{toast.textContent=s;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),3000)},fail=e=>say(e?.message||'Operation failed'),close=()=>{menu?.remove();menu=null},call=async f=>{busy=1;try{let r=await f();if(r?.message)say(r.message);return r}catch(e){fail(e)}finally{busy=0}};function pop(x,y,items){close();menu=document.createElement('div');menu.className='menu';items.forEach(([n,f])=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{close();call(f)};menu.append(b)});document.body.append(menu);let r=menu.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(x-r.width,innerWidth-r.width-8))+'px';menu.style.top=Math.max(8,Math.min(y,innerHeight-r.height-8))+'px';setTimeout(()=>addEventListener('pointerdown',e=>{if(!menu?.contains(e.target))close()},{once:true}),0)}async function load(){let list=await launcher.list();apps.replaceChildren(...list.map(a=>{let el=document.createElement('article');el.className='app';el.tabIndex=0;el.innerHTML=`<h2>${esc(a.name)}</h2><small>${esc(a.version)}${a.description?' · '+esc(a.description):''}</small><button class="dots" aria-label="Actions">⋮</button>`;el.onclick=e=>{if(!e.target.closest('.dots')&&!busy)launcher.open(a.id).catch(fail)};el.oncontextmenu=e=>{e.preventDefault();card(a,e.clientX,e.clientY)};el.querySelector('.dots').onclick=e=>{e.stopPropagation();let r=e.currentTarget.getBoundingClientRect();card(a,r.right,r.bottom)};return el}));$('#empty').hidden=!!list.length}function card(a,x,y){pop(x,y,[['Open',()=>launcher.open(a.id)],['Open in new window',()=>launcher.openNewWindow(a.id)],['Delete',()=>launcher.deleteApp(a.id).then(load)],['Share app',()=>launcher.shareApp(a.id)],['Share data',()=>launcher.shareAppData(a.id)]])}async function interfaces(){let list=await launcher.listInterfaces(),body=list.map(i=>`<button data-id="${esc(i.id)}">${esc(i.name)}${i.active?' · active':''}</button>`).join('');dialog('Interfaces',body,[['⋮ Add interface',async()=>{await launcher.importInterface();interfaces()}],['Close']]);document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await launcher.selectInterface(b.dataset.id);location.reload()})}function dialog(title,body,buttons){let d=document.createElement('div');d.className='modal';d.innerHTML=`<section class="panel"><h2>${title}</h2><div>${body}</div><div class="actions"></div></section>`;buttons.forEach(([n,f])=>{let b=document.createElement('button');b.textContent=n;b.onclick=async()=>{if(f)await call(f);else d.remove()};d.querySelector('.actions').append(b)});document.body.append(d)}$('#more').onclick=e=>{let r=e.currentTarget.getBoundingClientRect();pop(r.right,r.bottom,[['Refresh',()=>launcher.refresh().then(load)],['Add app',()=>launcher.importApp().then(load)],['Settings',async()=>{let i=await launcher.getSettingsInfo();dialog('Settings',`<p>Version: ${esc(i.version)}<br>Platform: ${esc(i.platform)}<br>Apps: ${esc(i.appsPath)}</p>`,[['Interface',interfaces],['Close']])}]])};addEventListener('keydown',e=>{if(e.key==='Escape')close()});window.__launcherClosePopup=()=>{let had=!!menu;close();return had};load().catch(fail)})()</script></html>
