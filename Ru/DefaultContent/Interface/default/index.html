<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Apps</title><style>:root{color-scheme:dark;font-family:system-ui;background:#12141c;color:#f6f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:24px 16px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:16px}h1{font-size:28px;margin:0}p,small{color:#aeb6c8}button{border:0;border-radius:12px;background:#365bff;color:#fff;padding:11px 15px;font-size:16px;cursor:pointer}.icon{width:44px;height:44px;padding:0;font-size:24px}.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.app{position:relative;min-height:116px;background:#1d2130;border:1px solid #2b3144;border-radius:16px;padding:16px 52px 16px 16px;cursor:pointer}.app h2{margin:0 0 7px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dots{position:absolute;top:8px;right:8px;width:40px;height:40px;padding:0;background:transparent}.menu{position:fixed;z-index:10;min-width:210px;padding:6px;background:#242936;border:1px solid #3a4254;border-radius:10px;box-shadow:0 12px 28px #0008}.menu button{display:block;width:100%;background:transparent;text-align:left;border-radius:6px}.menu button:hover{background:#365bff}.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:#0009}.panel{width:min(440px,100%);background:#242936;border:1px solid #3a4254;border-radius:16px;padding:20px}.settings-tabs,[data-interface-list]{display:flex;flex-wrap:wrap;gap:8px;margin-block:12px}.settings-tabs button[aria-pressed=false]{background:#373e51}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;z-index:30;left:50%;bottom:18px;transform:translateX(-50%);padding:10px 14px;background:#2d3445;border-radius:10px;opacity:0;transition:.15s}.toast.on{opacity:1}@media(max-width:480px){main{padding:16px 12px}.apps{grid-template-columns:1fr}}</style><main><header><div><h1>Mini Apps</h1><p>Локальные HTML-приложения</p></div><button id="more" class="icon" aria-label="Меню">⋮</button></header><section id="apps" class="apps"></section><p id="empty" hidden>Mini-apps не найдены.</p></main><div id="toast" class="toast" role="status"></div><script>(()=>{let menu,busy=0;const $=s=>document.querySelector(s),apps=$('#apps'),toast=$('#toast'),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),say=s=>{toast.textContent=s;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),3000)},fail=e=>say(e?.message||'Операция не выполнена'),close=()=>{menu?.remove();menu=null},call=async f=>{busy=1;try{let r=await f();if(r?.message)say(r.message);return r}catch(e){fail(e)}finally{busy=0}};function pop(x,y,items){close();menu=document.createElement('div');menu.className='menu';items.forEach(([n,f])=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{close();call(f)};menu.append(b)});document.body.append(menu);let r=menu.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(x-r.width,innerWidth-r.width-8))+'px';menu.style.top=Math.max(8,Math.min(y,innerHeight-r.height-8))+'px';setTimeout(()=>addEventListener('pointerdown',e=>{if(!menu?.contains(e.target))close()},{once:true}),0)}async function load(){let list=await launcher.list();apps.replaceChildren(...list.map(a=>{let el=document.createElement('article');el.className='app';el.tabIndex=0;el.innerHTML=`<h2>${esc(a.name)}</h2><small>${esc(a.version)}${a.description?' · '+esc(a.description):''}</small><button class="dots" aria-label="Действия">⋮</button>`;el.onclick=e=>{if(!e.target.closest('.dots')&&!busy)launcher.open(a.id).catch(fail)};el.oncontextmenu=e=>{e.preventDefault();card(a,e.clientX,e.clientY)};el.querySelector('.dots').onclick=e=>{e.stopPropagation();let r=e.currentTarget.getBoundingClientRect();card(a,r.right,r.bottom)};return el}));$('#empty').hidden=!!list.length}function card(a,x,y){pop(x,y,[['Открыть',()=>launcher.open(a.id)],['Открыть в новом окне',()=>launcher.openNewWindow(a.id)],['Удалить',()=>launcher.deleteApp(a.id).then(load)],['Поделиться приложением',()=>launcher.shareApp(a.id)],['Поделиться данными',()=>launcher.shareAppData(a.id)]])}let settingsPanel;
function closeSettings() {
  if (!settingsPanel) return false;
  settingsPanel.remove();
  settingsPanel = undefined;
  return true;
}
async function openSettings() {
  closeSettings();
  const [info, hasTelegram] = await Promise.all([launcher.getSettingsInfo(), launcher.hasTelegramClient()]);
  const overlay = document.createElement('div');
  overlay.className = 'modal';
  overlay.innerHTML = `<section class="panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <h2 id="settings-title">Настройки</h2>
    <nav class="settings-tabs" aria-label="Разделы настроек">
      <button type="button" data-tab="about" aria-pressed="true">О приложении</button>
      <button type="button" data-tab="interfaces" aria-pressed="false">Интерфейсы</button>
      <button type="button" data-tab="telegram" aria-pressed="false">Telegram</button>
    </nav>
    <section data-page="about"><p>Версия: ${esc(info.version)}<br>Платформа: ${esc(info.platform)}<br>Приложения: ${esc(info.appsPath)}</p></section>
    <section data-page="interfaces" hidden><div data-interface-list></div><button type="button" data-add-interface>Добавить интерфейс</button></section>
    <section data-page="telegram" hidden><div data-telegram-options></div><button type="button" data-install-telegram></button></section>
    <div class="actions"><button type="button" data-close-settings>Закрыть</button></div>
  </section>`;
  settingsPanel = overlay;
  document.body.append(overlay);
  const interfaceList = overlay.querySelector('[data-interface-list]');
  const renderInterfaces = async () => {
    const list = await launcher.listInterfaces();
    interfaceList.replaceChildren(...list.map(item => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = item.active ? `${item.name} (активен)` : item.name;
      button.onclick = () => call(async () => { await launcher.selectInterface(item.id); location.reload(); });
      return button;
    }));
  };
  const tabs = [...overlay.querySelectorAll('[data-tab]')];
  const pages = overlay.querySelectorAll('[data-page]');
  for (const tab of tabs) {
    tab.onclick = () => {
      tabs.forEach(button => button.setAttribute('aria-pressed', String(button === tab)));
      pages.forEach(page => { page.hidden = page.dataset.page !== tab.dataset.tab; });
      if (tab.dataset.tab === 'interfaces') void call(renderInterfaces);
    };
  }
  overlay.querySelector('[data-add-interface]').onclick = () => call(async () => {
    await launcher.importInterface();
    await renderInterfaces();
  });
  const install = overlay.querySelector('[data-install-telegram]');
  install.textContent = hasTelegram ? 'Обновить Telegram' : 'Установить Telegram';
  install.onclick = () => call(async () => {
    const result = await launcher.installTelegram();
    install.textContent = 'Обновить Telegram';
    await load();
    return result;
  });
  launcher.mountTelegramSettings?.(overlay.querySelector('[data-telegram-options]'));
  overlay.querySelector('[data-close-settings]').onclick = closeSettings;
  tabs[0].focus();
}
window.__launcherCloseSettings = closeSettings;
$('#more').onclick=e=>{let r=e.currentTarget.getBoundingClientRect();pop(r.right,r.bottom,[['Обновить',()=>launcher.refresh().then(load)],['Добавить приложение',()=>launcher.importApp().then(load)],['Настройки',openSettings]])};addEventListener('keydown',e=>{if(e.key==='Escape'&&!closeSettings())close()});window.__launcherClosePopup=()=>{let had=!!menu;close();return had};load().catch(fail)})()</script></html>
